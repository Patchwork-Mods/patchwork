[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates kept in the repo; see each one's README.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
patchwork-core = { path = "crates/patchwork-core" }
patchwork-sources = { path = "crates/patchwork-sources" }
patchwork-deployers = { path = "crates/patchwork-deployers" }
patchwork-formats = { path = "crates/patchwork-formats" }

anyhow = "1.0.104"
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases", "tokio"] }
async-trait = "0.1.92"
base64 = "0.22.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.34"
globset = "0.4.20"
jiff = { version = "0.2.38", features = ["serde"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = { version = "2.7.3", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.6"
unicode-normalization = "0.1.26"
uuid = {version = "1.28.0", features = ["serde", "v4"]}
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
