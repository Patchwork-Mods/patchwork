[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
patchwork-core = { path = "crates/patchwork-core" }
patchwork-sources = { path = "crates/patchwork-sources" }
patchwork-deployers = { path = "crates/patchwork-deployers" }

anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
toml = "1.1.6"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
