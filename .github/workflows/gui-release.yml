# Bundles the Patchwork app with Tauri for the GitHub Release that
# release.yml (dist) makes. dist runs this as a publish job (publish-jobs in
# dist-workspace.toml), before the release exists: the bundles and
# latest.json go up as workflow artifacts named `artifacts-*`, which dist's
# announce job puts in the release along with the CLI's. So a release only
# appears once every bundle and latest.json are ready, and if any of this
# fails there's no release at all, instead of one the app's updater can't
# read.
#
# Each bundle carries the CLI built for the same target (externalBin in
# tauri.release.conf.json). The bundles are signed for Tauri's updater, which
# reads latest.json. That needs these repository secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY           the private key from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# and the matching public key as plugins.updater.pubkey in tauri.conf.json.

name: GUI release

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is the {os}-{arch} the updater looks itself up by in
          # latest.json.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-aarch64 }
          - { runner: macos-14, target: aarch64-apple-darwin, platform: darwin-aarch64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x86_64 }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the updater key is set up
        shell: bash
        run: |
          if grep -q REPLACE_WITH crates/patchwork-gui/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still a placeholder; see the top of gui-release.yml"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev xdg-utils file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build the CLI to bundle
        shell: bash
        run: |
          cargo build --release --locked -p patchwork-cli --target ${{ matrix.target }}
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p crates/patchwork-gui/binaries
          cp "target/${{ matrix.target }}/release/patchwork$ext" \
            "crates/patchwork-gui/binaries/patchwork-${{ matrix.target }}$ext"

      - name: Bundle the app
        working-directory: crates/patchwork-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --target ${{ matrix.target }} --config tauri.release.conf.json

      # Gathers what goes in the release into out/, and for each bundle the
      # updater can install, a piece of latest.json into updater/: its key,
      # file name and signature. The `updater` job puts the pieces together.
      - name: Collect the bundles
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out updater

          # publish <file> [<updater key>...] [-- <published name>]
          publish() {
            local src=$1 name
            name=$(basename "$src")
            shift
            local keys=()
            while (($#)); do
              if [[ $1 == -- ]]; then name=$2; break; fi
              keys+=("$1")
              shift
            done
            cp "$src" "out/$name"
            for key in "${keys[@]}"; do
              if [[ ! -f "$src.sig" ]]; then
                echo "::error::$src has no updater signature"
                exit 1
              fi
              jq -n --arg key "$key" --arg file "$name" --rawfile sig "$src.sig" \
                '{($key): {file: $file, signature: ($sig | gsub("\\s"; ""))}}' > "updater/$key.json"
            done
          }

          # Exactly one of each, or something's changed about what Tauri
          # makes. Sets $found, rather than printing it, so its exit isn't
          # lost in a subshell.
          one() {
            if (($# != 1)); then
              echo "::error::expected one bundle, found $#: $*"
              exit 1
            fi
            found=$1
          }

          # Each bundle type gets its own key, so an update replaces a copy
          # with the same kind of bundle. The bare {os}-{arch} key is for
          # copies that don't know their bundle type (Nix, dev builds): they
          # can't update themselves, but their checks still look it up.
          case "$PLATFORM" in
            linux-*)
              one "$bundle"/appimage/*.AppImage
              publish "$found" "$PLATFORM-appimage" "$PLATFORM"
              one "$bundle"/deb/*.deb
              publish "$found" "$PLATFORM-deb"
              one "$bundle"/rpm/*.rpm
              publish "$found" "$PLATFORM-rpm"
              ;;
            darwin-*)
              one "$bundle"/dmg/*.dmg
              publish "$found"
              # Named Patchwork.app.tar.gz for every arch, so give each its own.
              version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
              one "$bundle"/macos/*.app.tar.gz
              publish "$found" "$PLATFORM-app" "$PLATFORM" \
                -- "Patchwork_${version}_${PLATFORM#darwin-}.app.tar.gz"
              ;;
            windows-*)
              one "$bundle"/nsis/*-setup.exe
              publish "$found" "$PLATFORM-nsis" "$PLATFORM"
              ;;
          esac
          ls -l out updater

      # Named artifacts-*, so dist's announce job puts them in the release.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-gui-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

      # Not artifacts-*: these only go into latest.json.
      - uses: actions/upload-artifact@v7
        with:
          name: gui-updater-${{ matrix.target }}
          path: updater/*
          if-no-files-found: error

  # Written once, from every platform's pieces, rather than by each bundle
  # job in turn, so no platform's entry can be lost to another's.
  updater:
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gui-updater-*
          path: updater
          merge-multiple: true

      - name: Write latest.json
        env:
          PLAN: ${{ inputs.plan }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(jq -r .announcement_tag <<< "$PLAN")
          mkdir -p out
          jq -s \
            --argjson plan "$PLAN" \
            --arg base "https://github.com/$REPO/releases/download/$tag" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version: $plan.releases[0].app_version,
              notes: ($plan.announcement_changelog // ""),
              pub_date: $date,
              platforms: (add | map_values({url: "\($base)/\(.file)", signature}))
            }' updater/*.json > out/latest.json
          cat out/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-gui-latest-json
          path: out/latest.json
          if-no-files-found: error
