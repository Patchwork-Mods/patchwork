# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
#
# It's since been edited by hand, so `dist generate` would undo that
# (allow-dirty in dist-workspace.toml stops dist complaining about it). The
# edits, each marked "Hand-added":
#
# * build-local-artifacts also bundles the Patchwork app with Tauri, in the
#   same job as the CLI it carries and with the same profile, so the two share
#   their compiled dependencies instead of each runner compiling them. Its
#   bundles go up as gui-bundle-*, which announce adds to the release.
# * gui-updater writes the latest.json the app's updater reads, and announce
#   waits for it, so a release only appears with every bundle and latest.json
#   in it.
# * The `only` input builds just some targets on a dry run, to debug one
#   platform without paying for all of them.
# * Caches are only saved from main, and builds time out.
# * check runs check.yml alongside a real release's builds, and host waits for
#   it, so nothing is published unless it passes.
#
# Releases are started by hand (dispatch-releases): Actions -> Release -> Run
# workflow on main, with the tag to make (a bare version, like 0.2.0). Running
# from main, rather than on a pushed tag, is what lets a release save and
# restore main's caches. A dry run (the default "tag") builds everything
# without releasing it.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you workflow_dispatch with a tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        required: true
        default: dry-run
        type: string
      # Hand-added (see the top of this file).
      only:
        description: "Dry runs only: the targets to build, comma-separated (blank for all)"
        required: false
        default: ""
        type: string

jobs:
  # Hand-added (see the top of this file).
  check:
    if: ${{ inputs.tag && inputs.tag != 'dry-run' }}
    uses: ./.github/workflows/check.yml

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ (inputs.tag != 'dry-run' && inputs.tag) || '' }}
      tag-flag: ${{ inputs.tag && inputs.tag != 'dry-run' && format('--tag={0}', inputs.tag) || '' }}
      publishing: ${{ inputs.tag && inputs.tag != 'dry-run' }}
      matrix: ${{ steps.matrix.outputs.val }}
      only: ${{ inputs.only }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (inputs.tag && inputs.tag != 'dry-run' && format('host --steps=create --tag={0}', inputs.tag)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      # Hand-added: narrows the build matrix to the `only` input's targets.
      - id: matrix
        env:
          ONLY: ${{ inputs.only }}
          PUBLISHING: ${{ inputs.tag && inputs.tag != 'dry-run' }}
        run: |
          set -euo pipefail
          if [[ -n $ONLY && $PUBLISHING == true ]]; then
            echo "::error::a release builds every target, so \`only\` is for dry runs"
            exit 1
          fi
          matrix=$(jq -c --arg only "$ONLY" '
            ($only | gsub("\\s"; "") | split(",") | map(select(. != ""))) as $only
            | .ci.github.artifacts_matrix
            | if $only == [] then . else .include |= map(select(any(.targets[]; IN($only[])))) end
          ' plan-dist-manifest.json)
          if [[ -n $ONLY && $(jq '.include | length' <<< "$matrix") == 0 ]]; then
            echo "::error::none of $ONLY is a target in dist-workspace.toml"
            exit 1
          fi
          echo "val=$matrix" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') || inputs.tag == 'dry-run' }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    # Hand-added: a hung macOS job would otherwise bill up to 6 hours at 10x.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
          # Hand-added: only main's caches can be restored by later runs on
          # main, and other branches' would crowd them out of the 10 GB.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

      # Hand-added from here to the end of the job: bundles the Patchwork app
      # with Tauri. Each bundle carries the CLI dist just built for the same
      # target (externalBin in tauri.release.conf.json), so it's the same
      # binary the release has on its own.
      #
      # The bundles are signed for Tauri's updater, which reads latest.json.
      # That needs these repository secrets:
      #
      #   TAURI_SIGNING_PRIVATE_KEY           the private key from `cargo tauri signer generate`
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
      #
      # and the matching public key as plugins.updater.pubkey in tauri.conf.json.
      - name: Check the updater key is set up
        shell: bash
        run: |
          if grep -q REPLACE_WITH crates/patchwork-gui/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still a placeholder; see release.yml"
            exit 1
          fi

      - name: Install the app's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev xdg-utils file

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Unpack the CLI to bundle
        shell: bash
        env:
          TARGET: ${{ matrix.targets[0] }}
        run: |
          set -euo pipefail
          mkdir -p cli-unpacked crates/patchwork-gui/binaries
          if [[ $TARGET == *windows* ]]; then
            ext=".exe"
            7z x -ocli-unpacked "target/distrib/patchwork-cli-$TARGET.zip"
          else
            ext=""
            tar -xJf "target/distrib/patchwork-cli-$TARGET.tar.xz" -C cli-unpacked
          fi
          # Not mapfile: macOS's bash is 3.2.
          found=()
          while IFS= read -r file; do found+=("$file"); done \
            < <(find cli-unpacked -type f -name "patchwork$ext")
          if ((${#found[@]} != 1)); then
            echo "::error::expected one patchwork$ext in dist's archive, found ${#found[@]}: ${found[*]-}"
            exit 1
          fi
          cp "${found[0]}" "crates/patchwork-gui/binaries/patchwork-$TARGET$ext"

      # Built with dist's profile, and on Windows its RUSTFLAGS, so cargo
      # reuses the dependencies dist just compiled for the CLI.
      - name: Bundle the app
        working-directory: crates/patchwork-gui
        env:
          TARGET: ${{ matrix.targets[0] }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLAN: ${{ needs.plan.outputs.val }}
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Ctarget-feature=+crt-static' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Bundles from an earlier version could come back with the cache.
          rm -rf "../../target/$TARGET"/*/bundle
          if [[ "$RUNNER_OS" != Linux ]]; then
            tauri build --target "$TARGET" --config tauri.release.conf.json -- --profile dist
            exit 0
          fi
          version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
          if [[ $version != *-* ]]; then
            tauri build --target "$TARGET" --config tauri.release.conf.json -- --profile dist
            exit 0
          fi
          # RPM versions can't have a '-', so a prerelease like 0.1.0-alpha.1
          # fails the rpm bundle, and Tauri won't take RPM's 0.1.0~alpha.1 as
          # the version since it isn't semver. So the rpm is bundled on its
          # own from the same build, as version 0.1.0 with release 0.alpha.1:
          # Fedora's way of writing a prerelease, which sorts before 0.1.0's
          # default release of 1, as semver does. Only the package's version
          # changes: the app inside still reports the real one.
          pre=${version#*-}
          tauri build --target "$TARGET" --config tauri.release.conf.json --bundles appimage,deb -- --profile dist
          # `tauri bundle` has no way to pick a profile: it only looks under
          # release, and bundles there.
          mkdir -p "../../target/$TARGET/release"
          cp "../../target/$TARGET/dist/patchwork-gui" "../../target/$TARGET/release/"
          tauri bundle --target "$TARGET" --config tauri.release.conf.json \
            --config "{\"version\": \"${version%%-*}\", \"bundle\": {\"linux\": {\"rpm\": {\"release\": \"0.${pre//-/.}\"}}}}" \
            --bundles rpm

      # Gathers what goes in the release into gui-out/, and for each bundle
      # the updater can install, a piece of latest.json into gui-updater/: its
      # key, file name and signature. The gui-updater job puts the pieces
      # together.
      - name: Collect the bundles
        shell: bash
        env:
          TARGET: ${{ matrix.targets[0] }}
          PLAN: ${{ needs.plan.outputs.val }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="target/$TARGET/dist/bundle"
          mkdir -p gui-out gui-updater

          # The {os}-{arch} the updater looks itself up by in latest.json.
          case "$TARGET" in
            x86_64-unknown-linux-gnu) platform=linux-x86_64 ;;
            aarch64-unknown-linux-gnu) platform=linux-aarch64 ;;
            aarch64-apple-darwin) platform=darwin-aarch64 ;;
            x86_64-pc-windows-msvc) platform=windows-x86_64 ;;
            *) echo "::error::no updater platform for $TARGET"; exit 1 ;;
          esac

          # publish <file> [<updater key>...] [-- <published name>]
          publish() {
            local src=$1 name
            name=$(basename "$src")
            shift
            local keys=()
            while (($#)); do
              if [[ $1 == -- ]]; then name=$2; break; fi
              keys+=("$1")
              shift
            done
            cp "$src" "gui-out/$name"
            # The +-guard is for macOS's bash 3.2, where set -u treats an
            # empty array as unbound.
            for key in ${keys[@]+"${keys[@]}"}; do
              if [[ ! -f "$src.sig" ]]; then
                echo "::error::$src has no updater signature"
                exit 1
              fi
              jq -n --arg key "$key" --arg file "$name" --rawfile sig "$src.sig" \
                '{($key): {file: $file, signature: ($sig | gsub("\\s"; ""))}}' > "gui-updater/$key.json"
            done
          }

          # Exactly one of each, or something's changed about what Tauri
          # makes. Sets $found, rather than printing it, so its exit isn't
          # lost in a subshell.
          one() {
            if (($# != 1)); then
              echo "::error::expected one bundle, found $#: $*"
              exit 1
            fi
            found=$1
          }

          # Each bundle type gets its own key, so an update replaces a copy
          # with the same kind of bundle. The bare {os}-{arch} key is for
          # copies that don't know their bundle type (Nix, dev builds): they
          # can't update themselves, but their checks still look it up.
          case "$platform" in
            linux-*)
              one "$bundle"/appimage/*.AppImage
              publish "$found" "$platform-appimage" "$platform"
              one "$bundle"/deb/*.deb
              publish "$found" "$platform-deb"
              # Under release for a prerelease; see "Bundle the app".
              one target/"$TARGET"/{dist,release}/bundle/rpm/*.rpm
              publish "$found" "$platform-rpm"
              ;;
            darwin-*)
              one "$bundle"/dmg/*.dmg
              publish "$found"
              # Named Patchwork.app.tar.gz for every arch, so give it its own.
              version=$(jq -r '.releases[0].app_version' <<< "$PLAN")
              one "$bundle"/macos/*.app.tar.gz
              publish "$found" "$platform-app" "$platform" \
                -- "Patchwork_${version}_${platform#darwin-}.app.tar.gz"
              ;;
            windows-*)
              one "$bundle"/nsis/*-setup.exe
              publish "$found" "$platform-nsis" "$platform"
              ;;
          esac
          ls -l gui-out gui-updater

      # Not artifacts-*, which the other dist jobs download: announce fetches
      # these itself.
      - uses: actions/upload-artifact@v7
        with:
          name: gui-bundle-${{ matrix.targets[0] }}
          path: gui-out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: gui-updater-${{ matrix.targets[0] }}
          path: gui-updater/*
          if-no-files-found: error

  # Hand-added: writes latest.json once, from every platform's pieces, rather
  # than by each build job in turn, so no platform's entry can be lost to
  # another's.
  gui-updater:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gui-updater-*
          path: gui-updater
          merge-multiple: true

      - name: Write latest.json
        env:
          PLAN: ${{ needs.plan.outputs.val }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(jq -r .announcement_tag <<< "$PLAN")
          mkdir -p gui-out
          jq -s \
            --argjson plan "$PLAN" \
            --arg base "https://github.com/$REPO/releases/download/$tag" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version: $plan.releases[0].app_version,
              notes: ($plan.announcement_changelog // ""),
              pub_date: $date,
              platforms: (add | map_values({url: "\($base)/\(.file)", signature}))
            }' gui-updater/*.json > gui-out/latest.json
          cat gui-out/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: gui-bundle-latest-json
          path: gui-out/latest.json
          if-no-files-found: error

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    # Hand-added: the installers need every target's build.
    if: ${{ needs.plan.outputs.only == '' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - check
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.check.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json

  # Hand-added: dist makes the release in host when there are no publish jobs,
  # but this waits for the app's bundles and latest.json too.
  announce:
    needs:
      - plan
      - host
      - gui-updater
    if: ${{ always() && needs.host.result == 'success' && needs.gui-updater.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      # Hand-added: the app's bundles and latest.json.
      - name: Download the app's bundles
        uses: actions/download-artifact@v8
        with:
          pattern: gui-bundle-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(needs.host.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(needs.host.outputs.val).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(needs.host.outputs.val).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
