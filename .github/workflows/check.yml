# Checks every pull request and every release (release.yml calls this before
# publishing): formatting, clippy, the tests, the UI's JavaScript, that the
# workspace still builds with the rust-version in Cargo.toml, and the
# dependencies' licenses, sources and security advisories (deny.toml). Pushes to main
# aren't checked; run it by hand from Actions -> Check to check one.
#
# Tests run on Linux only. macOS and Windows get a `cargo check`, which
# catches cfg(windows)/cfg(target_os = "macos") code that no longer
# compiles; their tests haven't been run there yet, so they aren't enforced.
#
# As in release.yml, caches are only saved from main, so here that means runs
# from a release or by hand.

name: Check

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      releasing:
        description: Check the dependencies as shipped, with nothing left out
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Full debug info fills the runner's disk while linking the test binaries,
  # which shows up as the linker dying with a bus error.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the app's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the app's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  ui:
    name: UI syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No build step, so a syntax error would only show up when the app runs.
      - name: Check the UI's modules parse
        run: |
          status=0
          for f in crates/patchwork-gui/ui/*.js; do
            node --check "$f" || status=1
          done
          exit $status

  msrv:
    name: rust-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the app's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev libxdo-dev
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  other-platforms:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The Hitman (smf) and DRG extensions use three git crates with no
      # license yet, which we can't ship. Pull requests check everything but
      # those; a release checks each frontend as it ships, with its `release`
      # features, which leave those extensions out. See deny.toml.
      - name: cargo deny check
        env:
          UNLICENSED: glacier-bin1 hitman-commons uasset_utils
        run: |
          if [ "${{ inputs.releasing }}" = "true" ]; then
            for frontend in cli gui; do
              cargo deny --manifest-path "crates/patchwork-$frontend/Cargo.toml" \
                --no-default-features --features release check
            done
          else
            args=(--all-features)
            for crate in $UNLICENSED; do args+=(--exclude "$crate"); done
            cargo deny "${args[@]}" check
          fi
