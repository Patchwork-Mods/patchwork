# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "nasb"
name = "Nickelodeon All‑Star Brawl"
description = "Brawl it out with your Nickelodeon favorites in epic platform battles."
image = "https://ccdn.thunderstore.io/assets/nasb/nasb-cover-360x480.webp"

[sources.thunderstore]
community = "nasb"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "CustomSongs"
to = "BepInEx/CustomSongs/{path}"

[[deployer.rules]]
folder = "Voicepacks"
to = "BepInEx/Voicepacks/{mod}/{path}"

[[deployer.rules]]
folder = "Skins"
to = "BepInEx/Skins/{mod}/{path}"

[[deployer.rules]]
folder = "Movesets"
to = "BepInEx/Movesets/{path}"

[[deployer.rules]]
files = "**/*.voicepack"
to = "BepInEx/Voicepacks/{mod}/{file}"

[[deployer.rules]]
files = "**/*.nasbskin"
to = "BepInEx/Skins/{mod}/{file}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

[detect]
steam = [1414850]
folder = "Nickelodeon All-Star Brawl"
exe = ["Nickelodeon All-Star Brawl.exe"]
