# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "patch-quest"
name = "Patch Quest"
image = "https://ccdn.thunderstore.io/assets/patch-quest/patch-quest-cover-360x480.webp"

[sources.thunderstore]
community = "patch-quest"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "melonloader-loader"

[[deployer.rules]]
folder = "Mods"
to = "Mods/{path}"

[[deployer.rules]]
folder = "ModManager"
to = "UserData/ModManager/{mod}/{path}"

[[deployer.rules]]
folder = "UserLibs"
to = "UserLibs/{path}"

[[deployer.rules]]
folder = "MelonLoader"
to = "MelonLoader/{path}"

[[deployer.rules]]
folder = "Managed"
to = "MelonLoader/Managed/{path}"

[[deployer.rules]]
folder = "Libs"
to = "MelonLoader/Libs/{path}"

[[deployer.rules]]
files = "**/*.managed.dll"
to = "MelonLoader/Managed/{file}"

[[deployer.rules]]
files = "**/*.lib.dll"
to = "UserLibs/{file}"

[[deployer.rules]]
files = "**/*.dll"
to = "Mods/{file}"

[[deployer.rules]]
files = "**"
to = "UserData/ModManager/{mod}/{path}"

[detect]
steam = [1347970]
folder = "Patch Quest"
exe = ["Patch Quest.exe"]
