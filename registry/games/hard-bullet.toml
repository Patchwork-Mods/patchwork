# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "hard-bullet"
name = "Hard Bullet"
description = "HARD BULLET is a physics-based action game, where enemies flood the neon-lit city bringing destruction to its streets. Use slow-motion, a huge arsenal, and brutal combat to survive and unlock new weapons. Prepare for the next RIDE by mastering your skills in Sandbox and Arena modes."
image = "https://ccdn.thunderstore.io/live/community/hard-bullet/hard-bullet-cover-360x480.png"

[sources.thunderstore]
community = "hard-bullet"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "melonloader-loader"

[[deployer.rules]]
folder = "Mods"
to = "Mods/{path}"

[[deployer.rules]]
folder = "ModManager"
to = "UserData/ModManager/{mod}/{path}"

[[deployer.rules]]
folder = "UserLibs"
to = "UserLibs/{path}"

[[deployer.rules]]
folder = "MelonLoader"
to = "MelonLoader/{path}"

[[deployer.rules]]
folder = "Managed"
to = "MelonLoader/Managed/{path}"

[[deployer.rules]]
folder = "Libs"
to = "MelonLoader/Libs/{path}"

[[deployer.rules]]
folder = "CustomNPCs"
to = "UserData/CustomNPCs/{path}"

[[deployer.rules]]
files = "**/*.managed.dll"
to = "MelonLoader/Managed/{file}"

[[deployer.rules]]
files = "**/*.lib.dll"
to = "UserLibs/{file}"

[[deployer.rules]]
files = "**/*.dll"
to = "Mods/{file}"

[[deployer.rules]]
files = "**/*.npc"
to = "UserData/CustomNPCs/{file}"

[[deployer.rules]]
files = "**"
to = "UserData/ModManager/{mod}/{path}"

[detect]
steam = [1294760]
folder = "Hard Bullet"
exe = ["Hard Bullet.exe"]
