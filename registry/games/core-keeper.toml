# Was generated by registry-gen; written by hand since mod.io was added, so
# the generator leaves it alone.

schema = 1
id = "core-keeper"
name = "Core Keeper"
description = "Explore a vast cavern of creatures, relics and resources in a mining sandbox adventure for 1-8 players. Mine, build, fight, craft and farm to unravel the mystery of the ancient Core."
image = "https://ccdn.thunderstore.io/live/community/core-keeper/core-keeper-cover-360x480_zlXiIbR.png"

[sources.thunderstore]
community = "core-keeper"

# The game's own mods. It loads them from StreamingAssets/Mods as well as
# from what its in-game mod.io browser downloads; mods subscribed to in game
# as well would load twice, so unsubscribe from those.
[sources.modio]
game = "corekeeper"
id = 5289

[deployer]
kind = "rules"
rulesets = ["bepinex"]

# Each mod.io mod goes in a folder of its own, which needs ModManifest.json
# directly inside it; the folder's name doesn't matter.
[[deployer.rules]]
sources = "modio"
to = "CoreKeeper_Data/StreamingAssets/Mods/{mod}/{path}"

# mod.io zips may or may not have a folder around the mod; this finds its
# top either way. Thunderstore mods have no ModManifest.json, so it leaves
# them alone.
[deployer.root]
markers = ["ModManifest.json"]

[detect]
steam = [1621690]
folder = "Core Keeper"
exe = ["CoreKeeper.exe"]
