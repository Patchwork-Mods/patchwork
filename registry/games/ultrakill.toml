schema = 1
id = "ultrakill"
name = "ULTRAKILL"
image = "https://ccdn.thunderstore.io/assets/ultrakill/ultrakill-cover-360x480.webp"

[sources.thunderstore]
community = "ultrakill"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "UMM Mods"
to = "BepInEx/UMM Mods/{mod}/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

[detect]
