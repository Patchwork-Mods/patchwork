# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "h3vr"
name = "H3VR"
description = "Do you like hot dogs? How about horseshoes? Hand grenades? (everyone likes hand grenades) Anyway, we've got all that, and guns. SO MANY GUNS. So if you like ordnance, meat, and far too many groan-worthy puns, this is the VR sandbox game for you."
image = "https://ccdn.thunderstore.io/assets/h3vr/h3vr-cover-360x480.webp"

[sources.thunderstore]
community = "h3vr"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "Sideloader"
to = "BepInEx/Sideloader/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[deployer.rules]]
files = "**/*.hotmod"
to = "BepInEx/Sideloader/{file}"

[[deployer.rules]]
files = "**/*.h3mod"
to = "BepInEx/Sideloader/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

[detect]
steam = [450540]
folder = "H3VR"
exe = ["h3vr.exe"]
