schema = 1
id = "baldurs-gate-3"
name = "Baldur's Gate 3"
description = "Mods' .pak files go in the Mods folder in the game's AppData (or its data folder, for the native Linux build), and their modules are loaded in the order you set on the profile's Load order tab, which is written to modsettings.lsx. Mods that need Script Extender say so there. Mods turned on in the in-game mod manager stay on, loaded before the profile's."

[sources.nexus]
game_domain = "baldursgate3"

[deployer]
kind = "bg3"

# Packages go in the Mods folder whatever folder they were packed in.
[[deployer.rules]]
files = "**/*.pak"
to = "mods:{file}"

# Script Extender, Native Mod Loader and the DLLs they load go next to the
# game's exe.
[[deployer.rules]]
folder = "bin"
to = "bin/{path}"

[[deployer.rules]]
folder = "NativeMods"
to = "bin/NativeMods/{path}"

[[deployer.rules]]
files = "**/DWrite.dll"
to = "bin/{file}"

# Loose files that replace the game's own.
[[deployer.rules]]
folder = "Data"
to = "Data/{path}"

# What's left is what mods are packed with for people and other managers:
# readmes, previews and `info.json`, which BG3 Mod Manager reads instead of
# the package's own `meta.lsx`.
[[deployer.rules]]
files = "**/{info.json,*.txt,*.md,*.png,*.jpg,*.jpeg,*.webp,*.url}"
skip = true

# Mods with a FOMOD installer are installed from the options picked in it.
# Its destinations go through the rules above, so packages end up in the
# Mods folder wherever the installer puts them.
[ext.fomod.installer]

[ext.bg3.mods]
paks = "mods"
file = "profile:modsettings.lsx"
# The game's own modules (from BG3 Mod Manager's list), which mods often
# name as dependencies.
builtin = [
    "991c9c7a-fb80-40cb-8f0d-b92d4e80e9b1", # Gustav
    "28ac9ce2-2aba-8cda-b3b5-6e922f71b6b8", # GustavDev
    "cb555efe-2d9e-131f-8195-a89329d218ea", # GustavX
    "ed539163-bb70-431b-96a7-f5b2eda5376b", # Shared
    "3d0c5ff8-c95d-c907-ff3e-34b204f1c630", # SharedDev
    "9dff4c3b-fda7-43de-a763-ce1383039999", # Engine
    "b77b6210-ac50-4cb1-a3d5-5702fb9c744c", # Honour
    "767d0062-d82c-279c-e16b-dfee7fe94cdd", # HonourX
    "e842840a-2449-588c-b0c4-22122cfce31b", # DiceSet_01
    "b176a0ac-d79f-ed9d-5a87-5c2c80874e10", # DiceSet_02
    "e0a4d990-7b9b-8fa9-d7c6-04017c6cf5b1", # DiceSet_03
    "77a2155f-4b35-4f0c-e7ff-4338f91426a4", # DiceSet_04
    "6efc8f44-cc2a-0273-d4b1-681d3faa411b", # DiceSet_05
    "ee4989eb-aab8-968f-8674-812ea2f4bfd7", # DiceSet_06
    "bf19bab4-4908-ef39-9065-ced469c0f877", # DiceSet_07
    "ee5a55ff-eb38-0b27-c5b0-f358dc306d34", # ModBrowser
    "630daa32-70f8-3da5-41b9-154fe8410236", # MainUI
    "e1ce736b-52e6-e713-e9e7-e6abbb15a198", # CrossplayUI
    "55ef175c-59e3-b44b-3fb2-8f86acc5d550", # PhotoMode
]

# The campaign, first in every load order. Since patch 8 it's GustavX;
# before, GustavDev.
[ext.bg3.mods.base]
uuid = "cb555efe-2d9e-131f-8195-a89329d218ea"
folder = "GustavX"
name = "GustavX"
version64 = 145241946983074840

[ext.bg3.extender]
file = "bin/DWrite.dll"

# The native Linux build keeps them in its data folder instead of AppData,
# and doesn't make the Mods folder itself.
[roots.mods]
path = "{localappdata}/Larian Studios/Baldur's Gate 3/Mods"
linux = "{data}/Larian Studios/Baldur's Gate 3/Mods"
allow = ["*.pak"]
create = true

[roots.profile]
path = "{localappdata}/Larian Studios/Baldur's Gate 3/PlayerProfiles/Public"
linux = "{data}/Larian Studios/Baldur's Gate 3/PlayerProfiles/Public"
allow = ["modsettings.lsx"]
# The game rewrites it on start, and drops mods it can't load.
rewritten = ["modsettings.lsx"]

# Starting the game itself skips Larian's launcher, which can reset the
# load order. Under Wine, Script Extender's DWrite.dll only loads in place
# of Wine's own when it's told to; one patchwork deploys is picked up by
# itself, but one put there by hand isn't.
[launch.vulkan]
name = "Baldur's Gate 3 (Vulkan)"
exe = "bin/bg3.exe"
args = ["--skip-launcher"]
dll_overrides = ["dwrite"]

[launch.dx11]
name = "Baldur's Gate 3 (DirectX 11)"
exe = "bin/bg3_dx11.exe"
args = ["--skip-launcher"]
dll_overrides = ["dwrite"]

[detect]
steam = [1086940]
folder = "Baldurs Gate 3"
# `bin/bg3` is the native Linux build.
exe = ["bin/bg3.exe", "bin/bg3_dx11.exe", "bin/bg3"]
