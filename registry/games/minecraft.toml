schema = 1
id = "minecraft"
name = "Minecraft: Java Edition"
description = "Mods, resource packs and shaders from Modrinth, for the Minecraft version and mod loader you pick for each profile. Point it at an instance's .minecraft folder from a launcher like Prism, which installs the loader and starts the game."

# Each profile picks which Minecraft and mod loader it's for, and mods are
# found to suit them. The instance has to be set up with the same.
[env.version]
name = "Minecraft version"

[env.loader]
name = "Mod loader"
choices = ["fabric", "quilt", "forge", "neoforge"]
default = "fabric"

# A profile can have a folder of its own to be deployed to, rather than
# the instance the game's set to, for pointing a launcher's instance at.
# Off by default; `patchwork instance on` to use one.
[instances]
default = false

[sources.modrinth]
project_types = ["mod", "resourcepack", "shader"]

# Quilt runs Fabric mods, and plenty are only uploaded for Fabric.
[sources.modrinth.loaders]
quilt = ["quilt", "fabric"]

[deployer]
kind = "rules"

# Resource packs and shader packs are both zips, so they go by what Modrinth
# says they are. Shaders need a mod like Iris to load them.
[[deployer.rules]]
kinds = "shader"
to = "shaderpacks/{file}"

[[deployer.rules]]
kinds = "resourcepack"
to = "resourcepacks/{file}"

[[deployer.rules]]
files = "*.jar"
to = "mods/{file}"
