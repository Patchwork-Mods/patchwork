schema = 1
id = "fallout-new-vegas"
name = "Fallout: New Vegas"
description = "Fallout: New Vegas. Mods' plugins (.esp, .esm) are loaded in the order you set on the profile's Plugins tab. For loose files to win over the game's archives, set `bInvalidateOlderFiles=1` and `SInvalidationFile=` under `[Archive]` in FalloutCustom.ini (or FalloutNV.ini), in Documents/My Games/FalloutNV."
# A load order is often tens of gigabytes of meshes and textures.
link = "hardlink"

[sources.nexus]
game_domain = "newvegas"

[deployer]
kind = "bethesda"

# Mods are packed every which way: from the game folder (`Data/...`), from
# inside Data (`meshes/...`, `Plugin.esp`), or with a wrapper folder around
# either. Each mod's top is found from what Data usually holds.
[deployer.root]
markers = [
    "Data",
    "*.esp", "*.esm", "*.bsa",
    "meshes", "textures", "sound", "music", "menus", "fonts", "shaders",
    "trees", "lodsettings", "video", "config", "NVSE",
]

# Mods with a FOMOD installer are installed from the options picked in it,
# which put files in Data.
[ext.fomod.installer]
folder = "Data"

# Tools like xEdit, FNVLODGen and BodySlide write their output into Data.
# `patchwork capture` keeps whatever's new there since the profile was
# deployed as a mod of its own.
[capture]
folders = ["Data"]
ignore = ["**/*.log"]

[[deployer.rules]]
folder = "Data"
to = "Data/{path}"

# Script extenders, their loaders and engine fixes go next to FalloutNV.exe.
# Only files at the top match, so `NVSE/Plugins/*.dll` still goes in Data.
[[deployer.rules]]
files = "*.exe"
to = "{path}"

[[deployer.rules]]
files = "*.dll"
to = "{path}"

[[deployer.rules]]
to = "Data/{path}"

# The game loads plugins in the order of their files' dates, masters
# first, and only the ones Plugins.txt lists. Mods' plugins are deployed as
# copies dated in the load order's order. The DLCs only load when they're
# listed, like mods' plugins. There are no light plugins.
[ext.bethesda.plugins]
folder = "Data"
file = "appdata:Plugins.txt"
order = "timestamps"
implicit = ["FalloutNV.esm"]
shipped = [
    "DeadMoney.esm", "HonestHearts.esm", "OldWorldBlues.esm", "LonesomeRoad.esm",
    "GunRunnersArsenal.esm", "CaravanPack.esm", "ClassicPack.esm",
    "MercenaryPack.esm", "TribalPack.esm",
]
light_flag = 0
limit = 255

[ext.loot.sort]
masterlist = "https://raw.githubusercontent.com/loot/falloutnv/v0.29/masterlist.yaml"

[roots.appdata]
path = "{localappdata}/FalloutNV"
allow = ["Plugins.txt", "plugins.txt", "loadorder.txt"]
rewritten = ["Plugins.txt"]

# Once xNVSE is deployed, the game starts through its loader.
[launch.nvse]
name = "New Vegas with xNVSE"
exe = "nvse_loader.exe"
default = true

[detect]
steam = [22380]
epic = ["5daeb974a22a435988892319b3a4f476"]
folder = "Fallout New Vegas"
exe = ["FalloutNV.exe"]

[[detect.version]]
kind = "exe"
file = "FalloutNV.exe"
parts = 4

# Script extender plugins' own settings files, which patchwork shows on the
# Config tab. Their types are guessed, from values and from names like
# `bEnabled` and `fScale`.
[[config]]
files = "Data/NVSE/Plugins/*.ini"
format = "generic.ini"

[[config]]
files = "Data/NVSE/Plugins/*.toml"
format = "generic.toml"
