schema = 1
id = "fallout-4-vr"
name = "Fallout 4 VR"
description = "Fallout 4 VR. Mods' plugins (.esp, .esm, .esl) are loaded in the order you set on the profile's Plugins tab. Light plugins (.esl) only load with an ESL support mod for F4SEVR. For loose files to win over the game's archives, set `bInvalidateOlderFiles=1` and `sResourceDataDirsFinal=` under `[Archive]` in Fallout4Custom.ini."
# A load order is often tens of gigabytes of meshes and textures.
link = "hardlink"

[sources.nexus]
game_domain = "fallout4"

[deployer]
kind = "bethesda"

# Mods are packed every which way: from the game folder (`Data/...`), from
# inside Data (`meshes/...`, `Plugin.esp`), or with a wrapper folder around
# either. Each mod's top is found from what Data usually holds.
[deployer.root]
markers = [
    "Data",
    "*.esp", "*.esm", "*.esl", "*.ba2",
    "meshes", "textures", "materials", "scripts", "interface", "sound", "music",
    "strings", "video", "vis", "lodsettings", "programs", "shadersfx", "F4SE", "MCM",
]

# Mods with a FOMOD installer are installed from the options picked in it,
# which put files in Data.
[ext.fomod.installer]
folder = "Data"

# Tools like xEdit, BodySlide and PRP write their output into Data.
# `patchwork capture` keeps whatever's new there since the profile was
# deployed as a mod of its own.
[capture]
folders = ["Data"]
ignore = ["**/*.log"]

[[deployer.rules]]
folder = "Data"
to = "Data/{path}"

# Script extenders, their loaders and engine fixes go next to Fallout4VR.exe.
# Only files at the top match, so `F4SE/Plugins/*.dll` still goes in Data.
[[deployer.rules]]
files = "*.exe"
to = "{path}"

[[deployer.rules]]
files = "*.dll"
to = "{path}"

[[deployer.rules]]
to = "Data/{path}"

# The load order goes in plugins.txt. The game's own masters always load
# first; there's no Creation Club content in VR.
[ext.bethesda.plugins]
folder = "Data"
file = "appdata:plugins.txt"
implicit = ["Fallout4.esm", "Fallout4_VR.esm"]
limit = 254
light_limit = 4096

[ext.loot.sort]
masterlist = "https://raw.githubusercontent.com/loot/fallout4vr/v0.21/masterlist.yaml"

[roots.appdata]
path = "{localappdata}/Fallout4VR"
allow = ["plugins.txt", "loadorder.txt"]
rewritten = ["plugins.txt"]

# Once F4SEVR is deployed, the game starts through its loader.
[launch.f4sevr]
name = "Fallout 4 VR with F4SEVR"
exe = "f4sevr_loader.exe"
default = true

[detect]
steam = [611660]
folder = "Fallout 4 VR"
exe = ["Fallout4VR.exe"]

[[detect.version]]
kind = "exe"
file = "Fallout4VR.exe"
parts = 3
