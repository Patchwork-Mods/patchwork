# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "subnautica"
name = "Subnautica"
description = "Descend into the depths of an alien underwater world filled with wonder and peril. Craft equipment, pilot submarines and out-smart wildlife to explore lush coral reefs, volcanoes, cave systems, and more - all while trying to survive."
image = "https://ccdn.thunderstore.io/assets/subnautica/subnautica-cover-360x480.webp"

[sources.thunderstore]
community = "subnautica"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
files = "{manifest.json,icon.png,README.md}"
skip = true

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "QMods"
to = "QMods/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{file}"

[detect]
steam = [264710]
folder = "Subnautica"
exe = ["Subnautica.exe"]
