schema = 1
id = "backpack-hero"
name = "Backpack Hero"
description = "The inventory management roguelike! Collect rare items, organize your backpack, and vanquish your foes!"
image = "https://ccdn.thunderstore.io/live/community/backpack-hero/backpack-hero-cover-360x480.png"

[sources.thunderstore]
community = "backpack-hero"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "melonloader-loader"

[[deployer.rules]]
folder = "Mods"
to = "Mods/{path}"

[[deployer.rules]]
folder = "ModManager"
to = "UserData/ModManager/{mod}/{path}"

[[deployer.rules]]
folder = "UserLibs"
to = "UserLibs/{path}"

[[deployer.rules]]
folder = "MelonLoader"
to = "MelonLoader/{path}"

[[deployer.rules]]
folder = "Managed"
to = "MelonLoader/Managed/{path}"

[[deployer.rules]]
folder = "Libs"
to = "MelonLoader/Libs/{path}"

[[deployer.rules]]
files = "**/*.managed.dll"
to = "MelonLoader/Managed/{file}"

[[deployer.rules]]
files = "**/*.lib.dll"
to = "UserLibs/{file}"

[[deployer.rules]]
files = "**/*.dll"
to = "Mods/{file}"

[[deployer.rules]]
files = "**"
to = "UserData/ModManager/{mod}/{path}"

[detect]
steam = [1970580]
folder = "Backpack Hero"
exe = ["Backpack Hero.exe", "linux.x86_64"]
