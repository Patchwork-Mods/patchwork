# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "gtfo"
name = "GTFO"
description = "GTFO is a hardcore cooperative horror shooter that throws you from gripping suspense to explosive action in a heartbeat. Stealth, strategy, and teamwork are necessary to survive in your deadly, underground prison. Work together or die together."
image = "https://ccdn.thunderstore.io/assets/gtfo/gtfo-cover-360x480.webp"

[sources.thunderstore]
community = "gtfo"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "GameData"
to = "BepInEx/GameData/{mod}/{path}"

[[deployer.rules]]
folder = "Assets"
to = "BepInEx/Assets/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

[detect]
steam = [493520]
folder = "GTFO"
exe = ["GTFO.exe"]
