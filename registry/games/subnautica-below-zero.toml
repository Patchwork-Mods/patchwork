# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "subnautica-below-zero"
name = "Subnautica: Below Zero"
description = "Dive into a freezing underwater adventure on an alien planet. Below Zero is set two years after the original Subnautica. Return to Planet 4546B to uncover the truth behind a deadly cover-up. Survive by building habitats, crafting tools, & diving deeper into the world of Subnautica."
image = "https://ccdn.thunderstore.io/live/community/subnautica-below-zero/subnautica-below-zero-cover-360x480.png"

[sources.thunderstore]
community = "subnautica-below-zero"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
files = "{manifest.json,icon.png,README.md}"
skip = true

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "QMods"
to = "QMods/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{file}"

[detect]
steam = [848450]
folder = "SubnauticaZero"
exe = ["SubnauticaZero.exe"]
