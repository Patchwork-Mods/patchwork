# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "valheim"
name = "Valheim"
description = "A brutal exploration and survival game for 1-10 players, set in a procedurally-generated purgatory inspired by viking culture. Battle, build, and conquer your way to a saga worthy of Odin’s patronage!"
image = "https://ccdn.thunderstore.io/assets/valheim/valheim-cover-360x480.webp"

[sources.thunderstore]
community = "valheim"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "bepinex-loader"

[[deployer.rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[deployer.rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[deployer.rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[deployer.rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

[[deployer.rules]]
folder = "config"
to = "BepInEx/config/{path}"

[[deployer.rules]]
folder = "SlimVML"
to = "BepInEx/SlimVML/{mod}/{path}"

[[deployer.rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[deployer.rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

[detect]
steam = [892970]
folder = "Valheim"
exe = ["valheim.exe", "valheim.x86_64"]
