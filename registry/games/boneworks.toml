# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

schema = 1
id = "boneworks"
name = "BONEWORKS"
description = "BONEWORKS is an Experimental Physics VR Adventure. Use found physics weapons, tools, and objects to fight across dangerous playscapes and mysterious architecture."
image = "https://ccdn.thunderstore.io/assets/boneworks/boneworks-cover-360x480.webp"

[sources.thunderstore]
community = "boneworks"

[deployer]
kind = "rules"

[[deployer.rules]]
ruleset = "melonloader-loader"

[[deployer.rules]]
files = "{manifest.json,icon.png,README.md,LICENCE}"
skip = true

[[deployer.rules]]
folder = "Mods"
to = "Mods/{path}"

[[deployer.rules]]
folder = "Plugins"
to = "Plugins/{path}"

[[deployer.rules]]
folder = "UserLibs"
to = "UserLibs/{path}"

[[deployer.rules]]
folder = "MelonLoader"
to = "MelonLoader/{path}"

[[deployer.rules]]
folder = "Managed"
to = "MelonLoader/Managed/{path}"

[[deployer.rules]]
folder = "Libs"
to = "MelonLoader/Libs/{path}"

[[deployer.rules]]
folder = "UserData"
to = "UserData/{path}"

[[deployer.rules]]
folder = "CustomItems"
to = "UserData/CustomItems/{path}"

[[deployer.rules]]
folder = "CustomMaps"
to = "UserData/CustomMaps/{path}"

[[deployer.rules]]
folder = "PlayerModels"
to = "UserData/PlayerModels/{path}"

[[deployer.rules]]
folder = "CustomLoadScreens"
to = "UserData/CustomLoadScreens/{path}"

[[deployer.rules]]
folder = "Music"
to = "UserData/Music/{path}"

[[deployer.rules]]
folder = "Food"
to = "UserData/Food/{path}"

[[deployer.rules]]
folder = "Scoreworks"
to = "UserData/Scoreworks/{path}"

[[deployer.rules]]
folder = "CustomSkins"
to = "UserData/CustomSkins/{path}"

[[deployer.rules]]
folder = "Grenades"
to = "UserData/Grenades/{path}"

[[deployer.rules]]
files = "**/*.managed.dll"
to = "MelonLoader/Managed/{file}"

[[deployer.rules]]
files = "**/*.plugin.dll"
to = "Plugins/{file}"

[[deployer.rules]]
files = "**/*.lib.dll"
to = "UserLibs/{file}"

[[deployer.rules]]
files = "**/*.grenade"
to = "UserData/Grenades/{file}"

[[deployer.rules]]
files = "**/*.melon"
to = "UserData/CustomItems/{file}"

[[deployer.rules]]
files = "**/*.body"
to = "UserData/PlayerModels/{file}"

[[deployer.rules]]
files = "**/*.load"
to = "UserData/CustomLoadScreens/{file}"

[[deployer.rules]]
files = "**/*.food"
to = "UserData/Food/{file}"

[[deployer.rules]]
files = "**/*.bcm"
to = "UserData/CustomMaps/{file}"

[[deployer.rules]]
files = "**/*.cma"
to = "UserData/CustomMaps/{file}"

[[deployer.rules]]
files = "**/*.wav"
to = "UserData/Music/{file}"

[[deployer.rules]]
files = "**/*.png"
to = "UserData/CustomSkins/{file}"

[[deployer.rules]]
files = "**/*.sw"
to = "UserData/Scoreworks/{file}"

[[deployer.rules]]
files = "**"
to = "Mods/{file}"

[detect]
steam = [823500]
folder = "BONEWORKS/BONEWORKS"
exe = ["BONEWORKS.exe", "Boneworks_Oculus_Windows64.exe"]
