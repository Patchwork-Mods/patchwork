# Install rules for BepInEx 5 and 6 games, following what r2modman does for
# Thunderstore packages (its BepInExInstaller and InstallRulePluginInstaller).
# Rules are tried in order and the first match wins; patterns ignore case.
#
#   files   glob matched against each file's path inside the mod
#   folder  only matches files under a folder with this name, at any depth;
#           {path} is then what comes after it. If a file is under several
#           named folders, the outermost one decides.
#   mods    glob, or list of globs, matched against the mod's name
#   kinds   glob(s) matched against what the mod's source says it is
#   sources glob(s) matched against the id of the mod's source, e.g. modio
#   ruleset includes another ruleset's rules at this point
#   strip   leading path components to drop (the rule doesn't apply if there
#           aren't enough)
#   to      destination in the game directory; {mod}, {path} (after stripping)
#           and {file} are filled in. Defaults to "{path}".
#   skip    don't deploy matching files

# The loader itself, which is the same for every BepInEx game.
[[rules]]
ruleset = "bepinex-loader"

# r2modman sends a folder named after one of its routes, wherever it is in
# the package, to that route. Each mod gets its own subfolder under plugins,
# core, patchers and monomod. Some mods rely on this: RoR2's BepInExPack
# refuses to load FixPluginTypesSerialization unless its path contains
# `RiskofThunder-FixPluginTypesSerialization`.
[[rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

# Config is shared, so it isn't per mod.
[[rules]]
folder = "config"
to = "BepInEx/config/{path}"

# Any other file goes by its extension, and loses the folders it was in.
# That includes the package's manifest.json, icon.png and README.md, which
# some mods read, e.g. to show in an in-game mod list.
[[rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"

# BepInEx writes each plugin's settings to a file of its own in
# BepInEx/config, with each setting's type and default in comments above
# it, so they can be changed from patchwork.
[[config]]
files = "BepInEx/config/**/*.cfg"
format = "bepinex.cfg"
