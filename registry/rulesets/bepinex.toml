# --- Mods ---

# r2modman sends a folder named after one of its routes, wherever it is in
# the package, to that route. Each mod gets its own subfolder under plugins,
# patchers, core and monomod. Some mods rely on this: RoR2's BepInExPack
# refuses to load FixPluginTypesSerialization unless its path contains
# `RiskofThunder-FixPluginTypesSerialization`.
[[rules]]
folder = "plugins"
to = "BepInEx/plugins/{mod}/{path}"

[[rules]]
folder = "patchers"
to = "BepInEx/patchers/{mod}/{path}"

[[rules]]
folder = "core"
to = "BepInEx/core/{mod}/{path}"

[[rules]]
folder = "monomod"
to = "BepInEx/monomod/{mod}/{path}"

# Config is shared, so it isn't per mod.
[[rules]]
folder = "config"
to = "BepInEx/config/{path}"

# Any other file goes by its extension, and loses the folders it was in.
# That includes the package's manifest.json, icon.png and README.md, which
# some mods read, e.g. to show in an in-game mod list.
[[rules]]
files = "**/*.mm.dll"
to = "BepInEx/monomod/{mod}/{file}"

[[rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{file}"
