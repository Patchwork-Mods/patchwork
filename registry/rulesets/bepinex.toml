# Install rules for BepInEx 5 and 6 games, following what r2modman does for
# Thunderstore packages (its BepInExInstaller and InstallRulePluginInstaller).
# Rules are tried in order and the first match wins; patterns ignore case.
#
#   files   glob matched against each file's path inside the mod
#   folder  only matches files under a folder with this name, at any depth;
#           {path} is then what comes after it. If a file is under several
#           named folders, the outermost one decides.
#   mods    glob, or list of globs, matched against the mod's name
#   strip   leading path components to drop (the rule doesn't apply if there
#           aren't enough)
#   to      destination in the game directory; {mod}, {path} (after stripping)
#           and {file} are filled in. Defaults to "{path}".
#   skip    don't deploy matching files

# --- The loader ---

# Loader packs keep BepInEx under a root folder whose contents go in the game
# directory. Matched by folder rather than by name, so a pack added from a
# local zip works too.
[[rules]]
files = "{BepInExPack*,BepInEx_Valheim_Full}/**"
strip = 1

# The one pack without a root folder. Its metadata isn't part of the loader.
[[rules]]
mods = "bbepis-BepInEx_Rogue_Tower"
files = "{manifest.json,icon.png,README.md}"
skip = true

[[rules]]
mods = "bbepis-BepInEx_Rogue_Tower"
files = "**"

# Everything else in a known loader pack (manifest, readme and so on) is left
# out, as r2modman does. From `modloaderPackages` in Thunderstore's ecosystem
# schema: https://thunderstore.io/api/experimental/schema/dev/latest/
[[rules]]
files = "**"
skip = true
mods = [
