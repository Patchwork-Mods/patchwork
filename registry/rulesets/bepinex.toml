# Install rules for BepInEx 5 games, following the layout r2modman uses for
# Thunderstore packages. Rules are tried in order and the first match wins.
#
#   files  glob matched against each file's path inside the mod
#   mods   optional glob matched against the mod's name
#   strip  leading path components to drop (the rule doesn't apply if there
#          aren't enough)
#   to     destination in the game directory; {mod}, {path} (after stripping)
#          and {file} are filled in. Defaults to "{path}".
#   skip   don't deploy matching files

# The loader itself: BepInExPack keeps everything under BepInExPack/.
[[rules]]
files = "BepInExPack/**"
strip = 1

# Thunderstore package metadata isn't part of the mod.
[[rules]]
files = "{manifest.json,icon.png,README.md,CHANGELOG.md,LICENSE,LICENSE.md,LICENSE.txt}"
skip = true

# Like r2modman, each mod gets its own folder under plugins, patchers, core
# and monomod, even if it ships a BepInEx/ folder of its own. Some mods rely on
# this: RoR2's BepInExPack refuses to load FixPluginTypesSerialization unless
# its path contains `RiskofThunder-FixPluginTypesSerialization`.
[[rules]]
files = "BepInEx/plugins/**"
strip = 2
to = "BepInEx/plugins/{mod}/{path}"

[[rules]]
files = "BepInEx/patchers/**"
strip = 2
to = "BepInEx/patchers/{mod}/{path}"

[[rules]]
files = "BepInEx/core/**"
strip = 2
to = "BepInEx/core/{mod}/{path}"

[[rules]]
files = "BepInEx/monomod/**"
strip = 2
to = "BepInEx/monomod/{mod}/{path}"

# Anything else under BepInEx/ (config and so on) goes in as-is.
[[rules]]
files = "BepInEx/**"

[[rules]]
files = "plugins/**"
strip = 1
to = "BepInEx/plugins/{mod}/{path}"

[[rules]]
files = "patchers/**"
strip = 1
to = "BepInEx/patchers/{mod}/{path}"

[[rules]]
files = "core/**"
strip = 1
to = "BepInEx/core/{mod}/{path}"

[[rules]]
files = "monomod/**"
strip = 1
to = "BepInEx/monomod/{mod}/{path}"

[[rules]]
files = "config/**"
strip = 1
to = "BepInEx/config/{path}"

# Anything else is treated as plugin content.
[[rules]]
files = "**"
to = "BepInEx/plugins/{mod}/{path}"
