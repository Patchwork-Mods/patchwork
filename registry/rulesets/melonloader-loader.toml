# MelonLoader before 0.7, installed like r2modman's MelonLoaderInstaller
# does: everything in the pack but its metadata goes in the game directory.

[[rules]]
mods = "LavaGang-MelonLoader"
files = "{manifest.json,icon.png,README.md}"
skip = true

[[rules]]
mods = "LavaGang-MelonLoader"
files = "**"

# Every mod's settings, which MelonLoader keeps in one TOML file.
[[config]]
files = "UserData/MelonPreferences.cfg"
format = "generic.toml"
