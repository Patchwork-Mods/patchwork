# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

# MelonLoader 0.7 and later, installed like r2modman's
# RecursiveMelonLoaderInstaller does: only the loader's own files go in the
# game directory. Its proxy DLL is version.dll or winhttp.dll.

[[rules]]
mods = [
    "HomeSafetyHotline_Modding-MelonLoader_HomeSafetyHotline",
    "LavaGang-MelonLoader",
    "SHMCD_Modding-MelonLoader_SHMCD",
]
files = "{MelonLoader/**,version.dll,winhttp.dll}"

[[rules]]
mods = [
    "HomeSafetyHotline_Modding-MelonLoader_HomeSafetyHotline",
    "LavaGang-MelonLoader",
    "SHMCD_Modding-MelonLoader_SHMCD",
]
files = "**"
skip = true

# Every mod's settings, which MelonLoader keeps in one TOML file.
[[config]]
files = "UserData/MelonPreferences.cfg"
format = "generic.toml"
