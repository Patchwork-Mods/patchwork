# Generated by registry-gen from Thunderstore's ecosystem schema; changes
# here are overwritten. To customize a game, put an overlay in your config
# directory instead (see registry/README.md).

# BepInEx itself, installed like r2modman's BepInExInstaller does: the
# contents of a loader pack's root folder go in the game directory, and
# the rest of the pack is left out.

# Matched by folder rather than by name, so a pack from a local zip works too.
[[rules]]
files = "{BepInExPack*,BepInEx_Valheim_Full}/**"
strip = 1

# Packs without a root folder. Their metadata isn't part of the loader.
[[rules]]
mods = "bbepis-BepInEx_Rogue_Tower"
files = "{manifest.json,icon.png,README.md}"
skip = true

[[rules]]
mods = "bbepis-BepInEx_Rogue_Tower"
files = "**"

