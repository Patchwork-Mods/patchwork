<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
  <!-- A box's corners for border-image (slice 40): a small diamond, two
       short arms that fade out along the edges, and a curl under each. The
       edges between the corners are left empty. -->
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="40" y2="0">
      <stop offset="0" stop-color="#ece7dc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ece7dc" stop-opacity="0"/>
    </linearGradient>
    <g id="arm" fill="none" stroke-linecap="round">
      <path d="M8 3.5 H40" stroke="url(#fade)" stroke-width="1.2"/>
      <path d="M13 3.5 C13 6.5 15 7.6 17.5 6.6" stroke="#ece7dc" stroke-opacity="0.65" stroke-width="0.8"/>
    </g>
    <g id="corner">
      <use xlink:href="#arm"/>
      <use xlink:href="#arm" transform="matrix(0 1 1 0 0 0)"/>
      <path d="M3.5 0.5 L6.5 3.5 L3.5 6.5 L0.5 3.5 Z" fill="#ece7dc"/>
    </g>
  </defs>
  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 1 120 0)"/>
  <use xlink:href="#corner" transform="matrix(1 0 0 -1 0 120)"/>
  <use xlink:href="#corner" transform="matrix(-1 0 0 -1 120 120)"/>
</svg>
