# Google Drive files shared by link (not folders or Google Docs). `confirm=t`
# skips the "can't scan this file for viruses" page big files get. A file
# that's had too many downloads lately gets a web page instead, which
# patchwork reports rather than installing.
name = "Google Drive"
links = [
    '^https?://drive\.google\.com/file/d/(?<id>[\w-]+)',
    '^https?://drive\.google\.com/(?:open|uc)\?(?:[^#]*&)?id=(?<id>[\w-]+)',
    '^https?://drive\.usercontent\.google\.com/download\?(?:[^#]*&)?id=(?<id>[\w-]+)',
]
link = "https://drive.google.com/file/d/${id}/view"
download = "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
