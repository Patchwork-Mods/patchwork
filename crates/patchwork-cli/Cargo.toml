[package]
name = "patchwork-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Patchwork, a universal mod manager: the command-line interface"

[[bin]]
name = "patchwork"
path = "src/main.rs"

[features]
# The games' extensions, all on by default. Release builds use `release`
# instead (dist-workspace.toml, release.yml, packaging/licenses.sh): it leaves
# out Hitman (smf) and Deep Rock Galactic (drg), which depend on git crates
# with no license yet (see deny.toml). Their games drop out of the game list.
default = ["bethesda", "bg3", "drg", "ftl", "helldivers", "smf"]
release = ["bethesda", "bg3", "ftl", "helldivers"]
bethesda = ["patchwork-builtin/bethesda"]
bg3 = ["patchwork-builtin/bg3"]
drg = ["patchwork-builtin/drg"]
ftl = ["patchwork-builtin/ftl"]
helldivers = ["patchwork-builtin/helldivers"]
smf = ["patchwork-builtin/smf"]

[dependencies]
patchwork-core.workspace = true
patchwork-builtin.workspace = true
patchwork-sync.workspace = true
patchwork-daemon.workspace = true
anyhow.workspace = true
clap.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true

[dev-dependencies]
patchwork-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
zip.workspace = true
