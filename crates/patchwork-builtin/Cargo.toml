[package]
name = "patchwork-builtin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bethesda", "ftl", "helldivers", "smf"]
bethesda = ["dep:patchwork-bethesda"]
ftl = ["dep:patchwork-ftl"]
helldivers = ["dep:patchwork-helldivers"]
smf = ["dep:patchwork-smf"]

[dependencies]
patchwork-core.workspace = true
patchwork-sources.workspace = true
patchwork-deployers.workspace = true
patchwork-formats.workspace = true
patchwork-bethesda = { workspace = true, optional = true }
patchwork-ftl = { workspace = true, optional = true }
patchwork-helldivers = { workspace = true, optional = true }
patchwork-smf = { workspace = true, optional = true }
toml_edit.workspace = true

[dev-dependencies]
toml.workspace = true
