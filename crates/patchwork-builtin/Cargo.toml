[package]
name = "patchwork-builtin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Registers the extensions bundled with Patchwork"

[features]
default = ["bethesda", "bg3", "drg", "ftl", "helldivers", "smf"]
bethesda = ["dep:patchwork-bethesda"]
bg3 = ["dep:patchwork-bg3"]
drg = ["dep:patchwork-drg"]
ftl = ["dep:patchwork-ftl"]
helldivers = ["dep:patchwork-helldivers"]
smf = ["dep:patchwork-smf"]

[dependencies]
patchwork-core.workspace = true
patchwork-sources.workspace = true
patchwork-deployers.workspace = true
patchwork-formats.workspace = true
patchwork-bethesda = { workspace = true, optional = true }
patchwork-bg3 = { workspace = true, optional = true }
patchwork-drg = { workspace = true, optional = true }
patchwork-ftl = { workspace = true, optional = true }
patchwork-helldivers = { workspace = true, optional = true }
patchwork-smf = { workspace = true, optional = true }
toml_edit.workspace = true

[dev-dependencies]
toml.workspace = true
