[package]
name = "patchwork-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Patchwork, a universal mod manager: the desktop app"

# Bundled and released by Tauri instead, with the CLI inside; see
# .github/workflows/release.yml.
[package.metadata.dist]
dist = false

[[bin]]
name = "patchwork-gui"
path = "src/main.rs"

[features]
# The games' extensions; `release` is what release builds use. Keep in step
# with patchwork-cli, which says why.
default = ["bethesda", "bg3", "drg", "ftl", "helldivers", "smf"]
release = ["bethesda", "bg3", "ftl", "helldivers"]
bethesda = ["patchwork-builtin/bethesda"]
bg3 = ["patchwork-builtin/bg3"]
drg = ["patchwork-builtin/drg"]
ftl = ["patchwork-builtin/ftl"]
helldivers = ["patchwork-builtin/helldivers"]
smf = ["patchwork-builtin/smf"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
notify.workspace = true
patchwork-core.workspace = true
patchwork-builtin.workspace = true
patchwork-sync.workspace = true
patchwork-daemon.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
toml.workspace = true
uuid.workspace = true

# malloc_trim, to give memory back after a deploy's build.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build.workspace = true
