[package]
name = "patchwork-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/patchwork-mods/patchwork"

# Bundled and released by Tauri instead, with the CLI inside; see
# .github/workflows/release.yml.
[package.metadata.dist]
dist = false

[[bin]]
name = "patchwork-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
patchwork-core.workspace = true
patchwork-sources.workspace = true
patchwork-deployers.workspace = true
patchwork-formats.workspace = true
patchwork-sync.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true

[build-dependencies]
tauri-build.workspace = true
