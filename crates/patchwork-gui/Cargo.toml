[package]
name = "patchwork-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository = "https://github.com/michaelgoldenn/patchwork-new"

# Tauri apps are bundled by Tauri, not dist.
[package.metadata.dist]
dist = false

[[bin]]
name = "patchwork-gui"
path = "src/main.rs"

[dependencies]
base64.workspace = true
futures-util.workspace = true
patchwork-core.workspace = true
patchwork-sources.workspace = true
patchwork-deployers.workspace = true
patchwork-formats.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
toml.workspace = true

[build-dependencies]
tauri-build.workspace = true
