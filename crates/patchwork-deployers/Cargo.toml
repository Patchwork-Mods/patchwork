[package]
name = "patchwork-deployers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
patchwork-core.workspace = true
globset.workspace = true
serde.workspace = true
toml.workspace = true
rpkg-rs = { version = "1.4.0", default-features = false, features = ["rayon"] }
json5 = "1.3.3"
serde_json = { workspace = true, features = ["preserve_order"] }
json-patch = "4.2.0"
# Hashes the names of localised strings.
crc32fast = "1.4.0"
# Entities: QuickEntity converts and patches them, glacier-bin1 reads and
# writes the game's binary form, and hitman-commons has the types between.
quickentity-rs = { path = "../../vendor/quickentity-rs" }
glacier-bin1 = { git = "https://github.com/atampy25/glacier-bin1", rev = "4755928", features = ["h3", "TEMP", "TBLU"] }
hitman-commons = { git = "https://github.com/atampy25/glacier-commons", rev = "455c9fc2f17a87ce3d164b6de65ecc527de7fe21", features = ["resourcelib", "serde"] }
serde_path_to_error = "0.1.20"
# Textures: converts SMF's TGAs into the game's TEXT and TEXD resources.
glacier-texture = { version = "2.2.0", default-features = false, features = ["rpkg"] }

[dev-dependencies]
tempfile.workspace = true
