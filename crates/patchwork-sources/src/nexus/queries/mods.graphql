query Mods(
  $viewUploaderHidden: Boolean,
  $viewUserBlockedContent: Boolean,
  $facets: ModsFacet,
  $filter: ModsFilter,
  $postFilter: ModsFilter,
  $sort: [ModsSort!],
  $offset: Int,
  $count: Int
) {
  mods(
    viewUploaderHidden: $viewUploaderHidden,
    viewUserBlockedContent: $viewUserBlockedContent,
    facets: $facets,
    filter: $filter,
    postFilter: $postFilter,
    sort: $sort,
    offset: $offset,
    count: $count
  ) {
    facets {
      ...NodesFacetFragment
    }
    facetsData
    nodes {
      ...ModFragment
    }
    nodesCount
    nodesFacets {
      ...NodesFacetFragment
    }
    nodesFilter
    totalCount
  }
}

fragment NodesFacetFragment on NodesFacet {
  count
  facet
  value
}

fragment ModFragment on Mod {
  adultContent
  author
  category
  createdAt
  description
  directDownloadEnabled
  downloads
  endorsements
  fileSize
  gameId
  id
  modId
  name
  pictureUrl
  status
  summary
  supportsVortex
  thumbnailUrl
  uid
  updatedAt
  version
  viewerBlocked
  viewerDownloaded
  viewerEndorsed
  viewerTracked
}
